<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Track Training</title>
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<meta name="theme-color" content="#0e1014">
<link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#0e1014;--s:#181b22;--s2:#20242d;--ink:#f1f3f5;--mu:#8d98a5;--ln:#2b303a;--a:#ff5a2a;--b:#ffc53d;--ok:#3ddc97}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef0f3;--s:#fff;--s2:#e6e9ee;--ink:#14181c;--mu:#5d6a75;--ln:#d2d7de;--a:#e8420f;--b:#d99a00;--ok:#16935a}}
:root[data-theme="light"]{--bg:#eef0f3;--s:#fff;--s2:#e6e9ee;--ink:#14181c;--mu:#5d6a75;--ln:#d2d7de;--a:#e8420f;--b:#d99a00;--ok:#16935a}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.big{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;margin:0;letter-spacing:.4px}
h1{font-size:40px}h2{font-size:28px}h3{font-size:20px}
main{max-width:540px;margin:0 auto;padding:14px 14px 96px;position:relative;z-index:1}
.mu{color:var(--mu)}.sm{font-size:14px}
.fl{position:fixed;z-index:0;opacity:.09;pointer-events:none;animation:dr 14s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(24px,-40px) rotate(40deg)}}
@keyframes lift{0%,100%{transform:translateY(14px) rotate(-6deg)}50%{transform:translateY(-16px) rotate(6deg)}}
@keyframes pulse{50%{transform:scale(1.18)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.db{animation:lift 2.4s ease-in-out infinite;display:block;margin:0 auto}
.card{background:var(--s);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px;animation:up .35s both}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--s);border:1px solid var(--ln);border-radius:14px;padding:12px}
.stat .big{font-size:34px;color:var(--b)}
.btn{background:linear-gradient(135deg,var(--a),#ff8a3d);color:#fff;border:0;border-radius:14px;padding:14px;font:800 20px 'Barlow Condensed',sans-serif;width:100%;cursor:pointer;letter-spacing:.6px;transition:transform .12s}
.btn:active{transform:scale(.96)}.btn.g{background:var(--s2);color:var(--ink)}
.chip{border:1px solid var(--ln);background:var(--s);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--a);border-color:var(--a);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
input,select{width:100%;height:46px;border:1px solid var(--ln);border-radius:12px;padding:0 12px;font:inherit;background:var(--s2);color:var(--ink);margin-bottom:8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.m{width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--s);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:10px;animation:up .35s both}
.m .big{font-size:26px}
.tag{background:var(--a);color:#fff;border-radius:8px;padding:2px 10px;font-weight:500;font-size:14px;animation:pulse 1.6s infinite}
.ok{color:var(--ok);font-size:14px}
.st{display:flex;align-items:center;border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:var(--s2)}
.st button{width:42px;height:48px;border:0;background:transparent;color:var(--a);font-size:24px;cursor:pointer}
.st button:active{background:var(--a);color:#fff}
.st input{flex:1;min-width:0;height:48px;border:0;text-align:center;font-size:20px;font-weight:500;margin:0;border-radius:0;background:transparent}
.st small{color:var(--mu);padding-right:2px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:2px;background:var(--s);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;max-width:90px;background:none;border:0;color:var(--mu);font:500 11px Barlow,sans-serif;cursor:pointer;padding:6px 0;border-radius:12px}
.nav button span{display:block;font-size:22px;transition:transform .2s}
.nav button.on{color:var(--a)}.nav button.on span{transform:translateY(-3px) scale(1.2)}
.fire{font-size:54px;display:inline-block;animation:pulse 1.2s infinite}
.dots{display:flex;gap:6px}.dots i{flex:1;height:10px;border-radius:5px;background:var(--s2)}.dots i.on{background:var(--a)}
.bar{height:12px;border-radius:6px;background:var(--s2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:6px;transition:width .5s}
.pill{background:var(--a);color:#fff;border-radius:999px;padding:4px 12px;font-weight:500;cursor:pointer}
.ch{width:100%;height:auto}.ch .ln{stroke-dasharray:1;animation:draw 1.2s ease-out both}.ch text{fill:var(--mu);font-size:10px}
.tm{font:800 76px 'Barlow Condensed',sans-serif;text-align:center;color:var(--b)}
.pod{text-align:center;padding:12px 6px}.pod .big{font-size:30px;color:var(--b)}
.rk{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:10px 0;border-top:1px solid var(--ln)}
.al{position:fixed;inset:0;z-index:20;background:rgba(14,16,20,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:#fff}
.al .fire{animation:shake .4s infinite}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:30;background:var(--b);color:#111;font-weight:500;border-radius:999px;padding:10px 20px;animation:pop .4s both;max-width:90%;text-align:center}
.lb{display:block;font-size:13px;color:var(--mu);margin:0 0 4px}
.err{color:#ff6b6b;min-height:22px;margin:4px 0}
</style>
</head>
<body>
<svg class="fl" style="left:-20px;top:12%" width="170" viewBox="0 0 120 50"><use href="#dbs"/></svg>
<svg class="fl" style="right:-30px;top:48%;animation-delay:-5s" width="190" viewBox="0 0 120 50"><use href="#dbs"/></svg>
<svg class="fl" style="left:30%;bottom:8%;animation-delay:-9s" width="110" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="10"/><circle cx="50" cy="50" r="10" fill="currentColor"/></svg>
<svg width="0" height="0" style="position:absolute"><defs><g id="dbs"><rect x="8" y="14" width="10" height="22" rx="3" fill="#ff5a2a"/><rect x="20" y="8" width="12" height="34" rx="3" fill="#ff5a2a"/><rect x="32" y="22" width="56" height="6" rx="3" fill="#9aa4ae"/><rect x="88" y="8" width="12" height="34" rx="3" fill="#ff5a2a"/><rect x="102" y="14" width="10" height="22" rx="3" fill="#ff5a2a"/></g></defs></svg>
<main id="app"></main>
<nav class="nav" id="nav" hidden></nav>
<script src="/supabase.js"></script>
<script src="config.js"></script>
<script>
document.documentElement.dataset.theme=(function(){try{return localStorage.getItem("tt_theme")}catch(e){}})()||"dark";
var fe=-1,pe=false,REC=location.hash.indexOf('type=recovery')>-1;
var $=function(i){return document.getElementById(i)},U=null,D=null,tab='home',cur=null,draft=[],mode='in',tm={on:false,min:90},ac,EXL=[],ex={q:'',m:'All',l:'All'},chs={k:'str',n:''};
function rd(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var sb=window.supabase.createClient(CFG.url,CFG.key),st;
function save(){D._t=new Date().toISOString();wr('tt_d_'+U.e,D);clearTimeout(st);st=setTimeout(push,800)}
async function push(){try{await sb.from('user_data').upsert({user_id:U.uid,data:D,updated_at:D._t})}catch(e){}}
addEventListener('online',function(){if(U&&D)push()});
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dsince(s){return Math.round((new Date(today())-new Date(s))/864e5)}
function fmt(d){return new Date(d).toLocaleDateString(undefined,{day:'numeric',month:'short'})}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}

/* ---------- exercise library (generated combinations) ---------- */
var EQ={B:'Barbell',D:'Dumbbell',C:'Cable',M:'Machine',S:'Smith Machine',K:'Kettlebell',R:'Band',W:''};
var MV={Chest:'Bench Press:BDSM,Fly:DCM,Press:MS,Push-Up:W,Pullover:DC,Crossover:C,Dip:W',
Back:'Row:BDCMS,Lat Pulldown:CM,Pull-Up:W,Deadlift:BD,Shrug:BDS,Pullover:DC,Face Pull:CR,Good Morning:B',
Shoulders:'Overhead Press:BDMSK,Lateral Raise:DCMR,Front Raise:BDC,Rear Delt Fly:DCM,Upright Row:BDC,Arnold Press:D,Push Press:BDK,Shrug:BD',
Biceps:'Curl:BDCMR,Hammer Curl:DCR,Preacher Curl:BDM,Concentration Curl:D,Spider Curl:BD,Reverse Curl:BDC,Drag Curl:B',
Triceps:'Pushdown:CR,Overhead Extension:BDCK,Skull Crusher:BD,Kickback:DC,Close-Grip Press:BSM,Dip:WM,Diamond Push-Up:W',
Legs:'Squat:BDSMKW,Leg Press:M,Lunge:BDSKW,Romanian Deadlift:BDK,Leg Extension:M,Leg Curl:M,Calf Raise:BDSM,Step-Up:DBW,Hack Squat:BM,Bulgarian Split Squat:DBW',
Glutes:'Hip Thrust:BDMS,Glute Bridge:BDW,Kickback:CMR,Cable Pull-Through:C,Sumo Deadlift:BDK,Abduction:MR',
Core:'Crunch:CMW,Plank:W,Leg Raise:W,Russian Twist:DKW,Wood Chop:CRK,Ab Wheel:W,Sit-Up:W,Dead Bug:W'};
var VR=['','Incline ','Decline ','Single-Arm ','Wide-Grip ','Close-Grip ','Paused ','Slow Tempo '];
var EXS=[];Object.keys(MV).forEach(function(m){MV[m].split(',').forEach(function(p){var a=p.split(':');a[1].split('').forEach(function(c){VR.forEach(function(v){
 EXS.push({n:v+(EQ[c]?EQ[c]+' ':'')+a[0],m:m,l:(!v&&'DMCWR'.indexOf(c)>-1)?'Beginner':(v&&'BSK'.indexOf(c)>-1)?'Advanced':'Intermediate'})})})})});

/* ---------- auth ---------- */
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=(h*33)^s.charCodeAt(i);return String(h>>>0)}
function seedData(){
 var S={Legs:[['Leg press',200,12],['Hack squat',110,10],['Stiff-leg deadlift',70,7],['Leg extension',100,10],['Squat',100,5],['Hamstring curl',50,8]],Shoulders:[['Smith traps',60,7],['Shoulder DB press (each)',30,5],['Lateral raise machine',15,15],['Reverse pec dec',45,8],['Shoulder press machine',40,6],['Rope face pull',45,10],['Shrugs plates',50,12]],Back:[['Bent-over neutral grip',80,8],['Underhand grip row',80,8],['Dumbbell row',50,7],['Single-hand lat pulldown',25,8]],Biceps:[['Long rod curl',15,9],['Preacher curl',15,8],['Rope hammer',40,12]],Chest:[['Bench press',80,7],['Incline chest press machine',80,6],['Decline DB press',22.5,12]],Triceps:[['Rod pushdown',45,8],['Overhead rod',40,8],['Reverse rod pushdown',35,10]]};
 var DT={Legs:'2026-09-30',Shoulders:'2026-09-30',Back:'2026-09-26',Biceps:'2026-09-26',Chest:'2026-09-29',Triceps:'2026-09-29'},d={gap:5,ex:{},logs:[],bw:[],food:[],p:null};
 Object.keys(S).forEach(function(m){d.ex[m]=S[m].map(function(x){return x[0]});d.logs.push({date:DT[m],muscle:m,min:45,entries:S[m].map(function(x){return{n:x[0],w:x[1],r:x[2]}})})});return d}
async function boot(){var r=await sb.auth.getSession(),ss=r.data.session;
 if(REC&&ss){mode='rec';return recView()}
 if(!ss){U=null;return authView()}
 var us=ss.user;U={e:us.id,uid:us.id,n:(us.user_metadata&&us.user_metadata.name)||us.email.split('@')[0]};
 var cached=rd('tt_d_'+U.e,null),res=null;try{res=await sb.from('user_data').select('data').eq('user_id',U.uid).maybeSingle()}catch(e){}
 var cloud=res&&res.data?res.data.data:null;
 if(cloud&&(!cached||(cloud._t||'')>=(cached._t||'')))D=cloud;
 else D=cached||freshData();
 save();$('nav').hidden=false;render();regSW()}
function authView(){if(mode=='fp')return fpView();if(mode=='rec')return recView();$('nav').hidden=true;var up=mode=='up';
 $('app').innerHTML='<div style="padding-top:18px"><svg class="db" width="200" viewBox="0 0 120 50"><use href="#dbs"/></svg><h1 style="text-align:center;margin-top:18px">Track Training</h1><p class="mu" style="text-align:center;margin:4px 0 20px">Log lifts. Keep the streak. Beat last week.</p><div class="card">'+(up?'<input id="an" placeholder="Your name" autocomplete="name">':'')+'<input id="ae" type="email" placeholder="Email" autocomplete="email"><input id="ap" type="password" placeholder="Password (6+ characters)" autocomplete="'+(up?'new-password':'current-password')+'"><div class="err" id="er"></div>'+(up?'':'<p class="sm" style="text-align:right;margin:0 0 10px"><a href="#" style="color:var(--b)" onclick="mode=\'fp\';authView();return false">Forgot password?</a></p>')+'<button class="btn" onclick="sign()">'+(up?'Create account':'Log in')+'</button><p class="sm mu" style="text-align:center;margin:12px 0 0">'+(up?'Have an account?':'New here?')+' <a href="#" style="color:var(--b)" onclick="mode=\''+(up?'in':'up')+'\';authView();return false">'+(up?'Log in':'Sign up free')+'</a></p></div><p class="sm mu" style="text-align:center">Your training data syncs securely to your account.</p><p class="sm mu" style="text-align:center;font-size:12px;margin:6px 0 0;letter-spacing:.5px">Created by Abhay Awasthi</p></div>'}
async function sign(){var n=($('an')||{value:''}).value.trim(),e=$('ae').value.trim().toLowerCase(),p=$('ap').value,er=function(m){$('er').textContent=m};
 if(!e||p.length<6)return er('Enter an email and a password with 6+ characters.');
 if(mode=='up'&&!n)return er('Add your name.');
 er('Please wait...');
 var r=mode=='up'?await sb.auth.signUp({email:e,password:p,options:{data:{name:n}}}):await sb.auth.signInWithPassword({email:e,password:p});
 if(r.error)return er(r.error.message);
 if(mode=='up'&&!r.data.session)return er('Check your email to confirm your account, then log in.');
 tab='home';boot()}
async function out(){await sb.auth.signOut();mode='in';boot()}

/* ---------- data helpers ---------- */
function vol(l){return l.entries.reduce(function(a,e){return a+e.w*e.r},0)}
function dates(){return Object.keys(D.logs.reduce(function(o,l){o[l.date]=1;return o},{})).sort()}
function streak(){var d=dates();if(!d.length||dsince(d[d.length-1])>2)return 0;var s=1;for(var i=d.length-1;i>0;i--){if((new Date(d[i])-new Date(d[i-1]))/864e5<=2)s++;else break}return s}
function lastLog(m){return D.logs.filter(function(x){return x.muscle===m}).sort(function(a,b){return a.date<b.date?1:-1})[0]}
function lastFor(m,n){var l=D.logs.filter(function(x){return x.muscle===m}).sort(function(a,b){return a.date<b.date?1:-1});for(var i=0;i<l.length;i++){var e=l[i].entries.filter(function(x){return x.n===n})[0];if(e)return{e:e,date:l[i].date}}return null}
function prs(){var b={};D.logs.forEach(function(l){l.entries.forEach(function(e){if(e.w<=0)return;var o=b[e.n];if(!o||e.w>o.w||(e.w==o.w&&e.r>o.r))b[e.n]={n:e.n,w:e.w,r:e.r,d:l.date}})});return Object.keys(b).map(function(k){return b[k]}).sort(function(a,c){return c.w-a.w})}
function burned(){return D.logs.reduce(function(a,l){return a+(l.min||45)*6},0)}
function calc(){var p=D.p;if(!p)return null;var bmr=10*p.w+6.25*p.h-5*p.a+(p.s=='m'?5:-161),t=bmr*p.act;return{bmr:Math.round(bmr),t:Math.round(t),loss:Math.round(t-500),gain:Math.round(t+400)}}

/* ---------- shell ---------- */
var TABS=[['home','🏠','Home'],['train','🏋️','Train'],['explore','🔎','Explore'],['food','🍎','Calories'],['chart','📈','Graphs'],['lifts','🏆','Lifts']];
function theme(){var t=document.documentElement.dataset.theme=="light"?"dark":"light";document.documentElement.dataset.theme=t;try{localStorage.setItem("tt_theme",t)}catch(e){}render()}
function go(t){fe=-1;tab=t;if(t!='train')cur=null;render();scrollTo(0,0)}
function render(){
 $('nav').innerHTML=TABS.map(function(t){return'<button class="'+(tab==t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('');
 var pill=tm.on?'<div class="pill" onclick="go(\'train\')">⏱ <span id="tp">'+mmss(tm.end-Date.now())+'</span></div>':'';
 var hd='<div class="row sp" style="margin-bottom:12px"><div class="big" style="font-size:22px;color:var(--a)">TRACK TRAINING</div><div class="row">'+pill+'<button class="chip" onclick="theme()" aria-label="Switch light or dark theme">'+(document.documentElement.dataset.theme=='light'?'🌙':'☀️')+'</button><button class="chip" onclick="bell()" aria-label="Workout reminder settings">🔔</button><button class="chip" onclick="out()">Log out</button></div></div>';
 $('app').innerHTML=hd+({home:vHome,train:vTrain,explore:vExplore,food:vFood,chart:vChart,lifts:vLifts}[tab])();
 if(tab=='explore')exl();
}

/* ---------- home ---------- */
function vHome(){if(DS)return vDesign();var s=streak(),dd=dates(),l=D.logs,wk=dd.filter(function(d){return dsince(d)<7}).length,goal=D.plan?D.plan.days:4,dots='';
 for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');dots+='<i class="'+(dd.indexOf(k)>-1?'on':'')+'"></i>'}
 var tv=l.reduce(function(a,x){return a+vol(x)},0),sp=D.plan?mkSplit(D.plan.days,D.plan.style):[],nx=nextDay(sp);
 var h='<h2>Hey '+esc(U.n)+'</h2><p class="mu" style="margin:0 0 12px">'+(s?'Keep it alive. One rest day is fine.':'Train today to start a streak.')+'</p>'
 +'<div class="card row" style="background:linear-gradient(135deg,var(--s),var(--s2))"><div class="fire">'+(s?'🔥':'💤')+'</div><div><div class="big" style="font-size:52px;line-height:1;color:var(--b)">'+s+' day'+(s==1?'':'s')+'</div><div class="mu sm">current streak</div></div></div>';
 if(!D.plan||pe)h+=planForm();
 h+='<div class="card"><div class="row sp"><b>This week</b><span class="mu sm">'+wk+' of '+goal+' sessions</span></div><div class="dots" style="margin:10px 0">'+dots+'</div><div class="bar"><i style="width:'+Math.min(100,wk/goal*100)+'%"></i></div></div>'
 +'<div class="g2" style="margin-bottom:12px"><div class="stat"><div class="big">'+dd.length+'</div><div class="mu sm">Training days</div></div><div class="stat"><div class="big">'+l.length+'</div><div class="mu sm">Muscle sessions</div></div><div class="stat"><div class="big">'+prs().length+'</div><div class="mu sm">Personal records</div></div><div class="stat"><div class="big">'+(D.plan?D.plan.days:'-')+'</div><div class="mu sm">Days per week goal</div></div></div>'
 +(dd.length>=4?'<div class="stat" style="margin-bottom:14px"><div class="big">'+Math.round(tv).toLocaleString()+' kg</div><div class="mu sm">Total volume lifted (weight × reps)</div></div>':'<div class="stat" style="margin-bottom:14px"><div class="big" style="font-size:24px">Total volume unlocks at 4 training days</div><div class="mu sm">'+dd.length+' of 4 days logged</div></div>');
 if(D.plan){h+='<div class="row sp" style="margin-bottom:6px"><h3>Your split</h3><button class="chip" onclick="pe=true;render()">Change plan</button></div><p class="mu sm" style="margin:0 0 8px">'+D.plan.days+' days a week · '+stName(D.plan.style)+'. Tap a muscle to train it.</p>';
  sp.forEach(function(x,i){h+='<div class="card" style="padding:12px;'+(i==nx?'border-color:var(--a)':'')+'"><div class="row sp"><b>Day '+(i+1)+' · '+esc(x.n)+'</b>'+(i==nx?'<span class="tag">Next</span>':'')+'</div>'+(x.rest?'<div class="mu sm" style="margin-top:6px">Rest and recover 😴</div>':'')+'<div class="chips" style="margin:8px 0 0">'+x.m.map(function(m){return'<button class="chip" onclick="tab=\'train\';start(\''+m+'\')">'+m+'</button>'}).join('')+'</div></div>'})}

 else if(style=='ppl'){var T=[['Push','push'],['Pull','pull'],['Legs','legs']];for(i=0;i<days;i++)o.push({n:T[i%3][0],m:P[T[i%3][1]]})}
 else{for(i=0;i<days;i++)o.push(i%2?{n:'Lower',m:P.legs}:{n:'Upper',m:P.up})}
 return o}
function stName(x){return{custom:'Your own split',single:'One muscle a day',ppl:'Push / Pull / Legs',ul:'Upper / Lower'}[x]||''}
function nextDay(sp){var l=D.logs.slice().sort(function(a,b){return a.date<b.date?1:-1})[0],j=0;if(l){var i=-1;sp.forEach(function(d,k){if(i<0&&d.m.indexOf(l.muscle)>-1)i=k});j=i<0?0:(i+1)%sp.length}
 var g=0;while(sp[j]&&sp[j].rest&&g++<sp.length)j=(j+1)%sp.length;return j}
function planForm(){var p=D.plan||{days:4};return'<div class="card"><b>'+(D.plan?'Change your plan':'Set up your training plan')+'</b><p class="mu sm" style="margin:2px 0 10px">Tell us how you train and we build your split.</p><label class="lb" for="pd">Training days per week</label><select id="pd">'+[2,3,4,5,6].map(function(n){return'<option value="'+n+'"'+(p.days==n?' selected':'')+'>'+n+' days</option>'}).join('')+'</select><label class="lb" for="ps2">Muscles per session</label><select id="ps2"><option value="auto">Suggest the best for my days</option><option value="single">One muscle per day</option><option value="ppl">2 to 3 muscles (Push / Pull / Legs)</option><option value="ul">4 or more (Upper / Lower)</option></select><button class="btn" onclick="savePlan()">Save plan</button><button class="btn g" style="margin-top:8px" onclick="openDS()">✏️ Design your own split</button></div>'}
function savePlan(){var n=+$('pd').value,st=$('ps2').value;if(st=='auto')st=n==5?'single':(n==3||n==6)?'ppl':'ul';D.plan={days:n,style:st};pe=false;save();toast('Plan saved');render()}
function resetAll(){if(!confirm('Delete all your logged workouts, meals and body weight? Your plan, reminder and exercise lists stay.'))return;var k={plan:D.plan,rem:D.rem,ex:D.ex};D=freshData();D.plan=k.plan;D.rem=k.rem;D.ex=k.ex;save();toast('Data reset');render()}
function fpView(){$('nav').hidden=true;$('app').innerHTML='<div style="padding-top:18px"><svg class="db" width="160" viewBox="0 0 120 50"><use href="#dbs"/></svg><h1 style="text-align:center;margin:14px 0">Reset password</h1><div class="card"><label class="lb" for="ae">Your account email</label><input id="ae" type="email" autocomplete="email"><div class="err" id="er"></div><button class="btn" onclick="sendReset()">Send reset link</button><p class="sm mu" style="text-align:center;margin:12px 0 0"><a href="#" style="color:var(--b)" onclick="mode=\'in\';authView();return false">Back to log in</a></p></div></div>'}
async function sendReset(){var e=$('ae').value.trim().toLowerCase();if(!e){$('er').textContent='Enter your email.';return}$('er').textContent='Please wait...';
 var r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin});$('er').textContent=r.error?r.error.message:'If that email has an account, a reset link is on its way. Check your inbox and spam folder.'}
function recView(){$('nav').hidden=true;$('app').innerHTML='<div style="padding-top:18px"><svg class="db" width="160" viewBox="0 0 120 50"><use href="#dbs"/></svg><h1 style="text-align:center;margin:14px 0">New password</h1><div class="card"><label class="lb" for="np">Choose a new password</label><input id="np" type="password" placeholder="6+ characters" autocomplete="new-password"><div class="err" id="er"></div><button class="btn" onclick="setPass()">Save password</button></div></div>'}
async function setPass(){var p=$('np').value;if(p.length<6){$('er').textContent='Use 6 or more characters.';return}var r=await sb.auth.updateUser({password:p});if(r.error){$('er').textContent=r.error.message;return}REC=false;try{history.replaceState(null,'',location.pathname)}catch(e){}toast('Password updated');mode='in';boot()}
/* alarm sound: real audio that loops, plus a silent keep-alive track while the timer runs */
var au=new Audio(),SIL,ALM;tm.ka=!!rd('tt_ka',false);
function wav(sec,f){var sr=8000,n=sr*sec,b=new ArrayBuffer(44+n),v=new DataView(b),w=function(o,t){for(var i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
 for(var i=0;i<n;i++)v.setUint8(44+i,128+Math.round(f(i/sr)*100));return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function snd(){if(!SIL){SIL=wav(1,function(){return 0});ALM=wav(2,function(t){return(t%.5<.25)?(Math.sin(2*Math.PI*880*t)>0?.9:-.9):0})}}
function kal(){if(!tm.ka)return;try{snd();au.src=SIL;au.loop=true;au.volume=1;var p=au.play();if(p&&p.catch)p.catch(function(){});if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:'Workout timer running',artist:'Track Training'})}catch(e){}}
function ring(){clearInterval(tm.al);if(navigator.vibrate)navigator.vibrate([500,200,500,200,500,200,900]);
 try{snd();au.src=ALM;au.loop=true;au.volume=1;var p=au.play();if(p&&p.catch)p.catch(function(){beep();tm.al=setInterval(beep,900)})}catch(e){beep();tm.al=setInterval(beep,900)}}
var DS=null,MU=['Chest','Back','Shoulders','Biceps','Triceps','Legs','Glutes','Core'];
function defEx(m){return EXS.filter(function(x){return x.m==m&&x.l=='Beginner'}).slice(0,4).map(function(x){return x.n})}
function openDS(){var c=D.plan&&D.plan.style=='custom'&&D.plan.custom;DS=c?JSON.parse(JSON.stringify(c)):[{n:'Push',m:['Chest','Shoulders','Triceps']},{n:'Pull',m:['Back','Biceps']},{n:'Legs',m:['Legs']},{n:'Rest',rest:true,m:[]},{n:'Upper',m:['Chest','Back','Shoulders','Biceps','Triceps']},{n:'Lower',m:['Legs']}];render();scrollTo(0,0)}
function vDesign(){var used={};DS.forEach(function(d){d.m.forEach(function(m){used[m]=1;if(!D.ex[m])D.ex[m]=defEx(m)})});
 var h='<button class="chip" onclick="DS=null;render()">‹ Cancel</button><h2 style="margin:10px 0 2px">Design your own split</h2><p class="mu" style="margin:0 0 12px">Name each day, pick its muscles, and add rest days. Then adjust the exercises for each muscle below. The example is Push, Pull, Legs, Rest, Upper, Lower.</p>';
 DS.forEach(function(d,i){h+='<div class="card"><div class="row sp" style="margin-bottom:8px"><b>Day '+(i+1)+(d.rest?' · Rest':'')+'</b><button class="chip" aria-label="Delete day" onclick="dsDel('+i+')">🗑</button></div><label class="lb" for="dn'+i+'">Day name</label><input id="dn'+i+'" value="'+esc(d.n)+'" onchange="DS['+i+'].n=this.value"><button class="chip'+(d.rest?' on':'')+'" style="margin-bottom:8px" onclick="dsRest('+i+')">😴 Rest day</button>'
  +(d.rest?'':'<div class="chips" style="flex-wrap:wrap">'+MU.map(function(m){return'<button class="chip'+(d.m.indexOf(m)>-1?' on':'')+'" onclick="dsTog('+i+',\''+m+'\')">'+m+'</button>'}).join('')+'</div>')+'</div>'});
 h+='<div class="g2" style="margin-bottom:14px"><button class="btn g" onclick="dsAdd(false)">+ Training day</button><button class="btn g" onclick="dsAdd(true)">+ Rest day</button></div>';
 var um=Object.keys(used);
 if(um.length){h+='<h3 style="margin-bottom:6px">Exercises for each muscle</h3><p class="mu sm" style="margin:0 0 8px">Tap an exercise to remove it. Add your own, or use Explore for 1,000+ more.</p>';
  um.forEach(function(m){h+='<div class="card"><b>'+m+'</b><div class="chips" style="flex-wrap:wrap;margin:8px 0">'+D.ex[m].map(function(n,j){return'<button class="chip" onclick="dsRm(\''+m+'\','+j+')">'+esc(n)+' ✕</button>'}).join('')+'</div><div class="row"><input id="dx'+m+'" placeholder="Add exercise" style="margin:0"><button class="chip" onclick="dsAddEx(\''+m+'\')">Add</button></div></div>'})}
 return h+'<button class="btn" onclick="dsSave()">Save my split</button>'}
function dsTog(i,m){var a=DS[i].m,k=a.indexOf(m);if(k>-1)a.splice(k,1);else a.push(m);render()}
function dsRest(i){DS[i].rest=!DS[i].rest;if(DS[i].rest){DS[i].m=[];if(!DS[i].n||/^Day \d+$/.test(DS[i].n))DS[i].n='Rest'}render()}
function dsDel(i){DS.splice(i,1);render()}
function dsAdd(r){DS.push(r?{n:'Rest',rest:true,m:[]}:{n:'Day '+(DS.length+1),m:[]});render()}
function dsRm(m,j){D.ex[m].splice(j,1);save();render()}
function dsAddEx(m){var v=$('dx'+m).value.trim();if(!v||D.ex[m].indexOf(v)>-1)return;D.ex[m].push(v);save();render()}
function dsSave(){var tr=DS.filter(function(d){return !d.rest&&d.m.length});if(!tr.length){toast('Add at least one training day with a muscle');return}
 DS.forEach(function(d,i){d.n=(d.n||'').trim()||('Day '+(i+1))});
 D.plan={days:tr.length,style:'custom',custom:DS};DS=null;pe=false;save();toast('Your split is saved');render()}
regSW();
boot();
